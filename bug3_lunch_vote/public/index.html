<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 점심 메뉴 투표</title>
<style>
  body { font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
         background: #f4f7fb; margin: 0; padding: 40px 16px; color: #1a1a1a; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px;
         padding: 32px 36px; box-shadow: 0 4px 18px rgba(0,47,111,.08); }
  h1 { margin: 0 0 6px; font-size: 26px; color: #002f6f; }
  .date { color: #667; font-size: 14px; margin-bottom: 24px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center;
       padding: 14px 18px; margin-bottom: 10px; border-radius: 10px;
       background: #f8fafc; font-size: 17px; }
  .votes { color: #2666f2; font-weight: bold; }
  .foot { margin-top: 24px; font-size: 13px; color: #778; }
</style>
</head>
<body>
  <div class="box">
    <h1>오늘의 점심 메뉴 투표</h1>
    <div class="date">8월 29일 (금) · 12:00 마감</div>

    <ul>
      <li><span>김치찌개</span><span class="votes">3표</span></li>
      <li><span>돈까스</span><span class="votes">2표</span></li>
      <li><span>냉면</span><span class="votes">1표</span></li>
    </ul>

    <div class="foot">메뉴 추가·수정은 이 파일(index.html)을 고치면 됩니다.</div>
  </div>
</body>
</html>
