<style>
  @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@1.0/nanumsquare.css");
  :root{
    --bg:#0f1420; --panel:#161c2b; --panel2:#1b2233; --border:#2a3346;
    --text:#e7ecf5; --muted:#8b97ad; --accent:#5b8cff; --accent-hover:#4a7bee;
    --accent2:#3fb984; --code-bg:#0b0f1a; --code-text:#dbe4f3; --hover:#212a3d;
    --badge-bg:#1b2233; --scroll:#2c3852;
  }
  html[data-theme="light"]{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#f2f5fb; --border:#d9dfea;
    --text:#1d2733; --muted:#5c6675; --accent:#3b6fe0; --accent-hover:#2f60cf;
    --accent2:#1f9d6b; --code-bg:#f5f8fc; --code-text:#232c38; --hover:#eaf0fb;
    --badge-bg:#e9eef7; --scroll:#c3ccdb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"NanumSquare","Malgun Gothic","맑은 고딕",-apple-system,'Segoe UI',sans-serif;font-weight:700;background:var(--bg);color:var(--text);overflow:hidden;transition:background .2s,color .2s}
  .app{display:flex;height:100vh}
  .sidebar{width:360px;min-width:250px;max-width:60%;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .2s,border-color .2s}
  .sidebar-head{padding:18px 20px;border-bottom:1px solid var(--border)}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sidebar-head h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
  .theme-btn{flex-shrink:0;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .theme-btn:hover{background:var(--hover);border-color:var(--accent)}
  .sidebar-head p{font-size:16px;color:var(--muted);margin-top:8px;font-weight:700}
  .search{margin-top:14px}
  .search input{width:100%;padding:10px 13px;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);color:var(--text);font-size:16px;font-family:inherit;font-weight:700;outline:none}
  .search input:focus{border-color:var(--accent)}
  .nav{flex:1;overflow-y:auto;padding:10px 10px 30px}
  .module{margin-bottom:6px}
  .mod-head{font-size:16px;font-weight:800;color:var(--accent);padding:13px 12px 7px;letter-spacing:.2px}
  .title-item{padding:10px 12px 10px 20px;border-radius:8px;cursor:pointer;font-size:17px;font-weight:700;color:var(--text);line-height:1.45;transition:background .12s;border:1px solid transparent}
  .title-item:hover{background:var(--hover)}
  .title-item.active{background:var(--accent);color:#fff;font-weight:800}
  .title-item .badge{display:inline-block;font-size:13px;font-weight:700;background:var(--badge-bg);color:var(--muted);border-radius:5px;padding:1px 7px;margin-left:7px;vertical-align:middle}
  .title-item.active .badge{background:rgba(255,255,255,.24);color:#fff}
  .content{flex:1;overflow-y:auto;padding:32px 38px 60px}
  .content-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;font-size:16px}
  .content-empty svg{opacity:.5}
  .crumb{font-size:16px;color:var(--muted);margin-bottom:7px;font-weight:700}
  .content h2{font-size:27px;font-weight:800;margin-bottom:24px;letter-spacing:-.3px}
  .block{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
  .block-head{display:flex;align-items:center;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--border)}
  .block-label{font-size:16px;font-weight:800;color:var(--accent2)}
  .copy-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 15px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:background .12s}
  .copy-btn:hover{background:var(--accent-hover)}
  .copy-btn.done{background:var(--accent2)}
  pre.code{margin:0;padding:17px;background:var(--code-bg);font-family:"NanumSquare","Malgun Gothic",'Consolas',monospace;font-weight:700;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;overflow-x:auto;color:var(--code-text)}
  .resizer{width:5px;cursor:col-resize;background:transparent;flex-shrink:0}
  .resizer:hover{background:var(--accent)}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--accent2);color:#fff;padding:13px 24px;border-radius:10px;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  @media(max-width:640px){.sidebar{width:46%}.content{padding:20px}}
</style>
</head>

<script>
const DATA = [{"name":"2. 웹 이해","items":[{"title":"1. HTML Tag의 기본 구조","contents":[{"text":"\u003c!-- 기본 HTML 구조 이해하기 -->\n\u003chtml>\n\u003chead>\n        \u003ctitle> My First Web Page \u003c/title>\n\u003c/head>\n\n\u003cbody>\n        Hello World!\n\u003c/body>\n\u003c/html>"}]},{"title":"2. CSS(Cascading Style Sheet)","contents":[{"text":"관심종목\u003cbr>\n\u003cul>\n    \u003cli>키움증권\u003c/li>\n    \u003cli>대신증권\u003c/li>\n    \u003cli>미래에셋대우\u003c/li>\n\u003c/ul>"},{"text":"\u003cstyle>\nli {\n    width: 120px;\n    margin: 8px;\n    padding-bottom: 4px;\n    font-weight: bold;\n    color: olive;\n    border-bottom: 1px solid #ccc;\n}\n\u003c/style>\n\n관심종목\u003cbr>\n\u003cul>\n    \u003cli>키움증권\u003c/li>\n    \u003cli>대신증권\u003c/li>\n    \u003cli>미래에셋대우\u003c/li>\n\u003c/ul>"}]},{"title":"3. JSON","contents":[{"text":"https://github.com/torvalds"},{"text":"https://api.github.com/users/torvalds"}]}]},{"name":"4. 바이브코딩 기반 앱 개발","items":[{"title":"1. PDF 분할/병합","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\nPython과 PyQt5를 사용해 간단한 PDF 분할/병합하는 앱을 만들거야\n\n- PDF 업로드는 ‘pypdf’(또는 PyPDF2) 패키지 사용\n- UI는 심플하고 직관적인 기본 수준의 PyQt5 인터페이스로 구현\n- pdf 업로드 및 미리보기 기능(썸네일)\n- 분할 기능 : 범위 입력, 페이지 입력, 고정페이지 분할\n- 병합 기능 : 파일 선택, 병합버튼"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어\nPDF 분할/병합하는 앱을 만들거야\n1. 개발환경\n  - PDF 업로드는 ‘pypdf’(또는 PyPDF2) 패키지 사용\n\n2. 노드설명\n  - pdf 업로드 기능\n  - 분할 기능 : 범위 입력, 페이지 입력, 고정페이지 분할\n  - 병합 기능 : 파일 선택, 병합버튼\n\n3. UI설명\n  - PyQt5 인터페이스, 심플하고 직관적인 기본 수준\n  - pdf 썸네일 미리보기 UI\n  - 분할 : 범위 입력창, 페이지 입력창, 고정페이지 입력창\n  - 병합 : 파일 선택 버튼, 병합 버튼"}]},{"title":"2. 이미지 사이즈 및 컬러 조정","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\n이미지를 업로드하면 사이즈 및 컬러 조정하는 앱을 만들거야\n\n - pyqt5 활용\n - 여러 이미지 업로드\n - 컬러조정 : RGB 바를 이용해 실시간으로 이미지 컬러 조정, 버튼으로 흑백 변경\n - 크기 조정 : 이미지 사이즈를 x,y 픽셀을 입력하여 크기 조정, \n                        가로 또는 세로 사이즈 조정시 다른 사이즈 자동 설정,\n                        하나의 이미지 사이즈 설정시 다른 이미지도 동일한 사이즈로 일괄 적용  \n - 결과 저장 : 수정된 결과를 jpg, png, gif 등으로 저장"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어.\n이미지 사이즈 및 컬러 조정하는 앱을 만들거야\n1. 개발환경\n  - PyQt5 활용\n\n2. 노드설명\n  - 이미지 업로드 (다중 업로드 지원)\n  - 하나의 이미지를 수정하면 동일한 기준으로 다른 이미지에도 일괄 적용\n  - 컬러 조정: RGB 바를 이용해 실시간으로 이미지 컬러 조정\n  - 크기 조정: x사이즈 입력 시 비율에 맞춰 y사이즈 자동 조정\n  - 흑백 변환 기능\n  - 결과 저장: 수정된 결과를 jpg, png, gif 등으로 저장\n\n3. UI설명\n  - 다중 이미지 업로드 UI\n  - RGB 슬라이더 바 (실시간 컬러 조정)\n  - x 픽셀 입력창 / y사이즈 자동 계산 표시\n  - 흑백 변환 버튼\n  - 저장 형식 선택 (jpg, png, gif 등)"}]},{"title":"3. 노트북lm 슬라이드 PPTX로 변환","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\n구글 노트북 LM으로 작성한 이미지 슬라이드를 편집가능한 PPTX로 변환하는 앱을 만들거야\n\n- 파이썬 PyQt5 패키지를 이용해\n- 나에게 없는 패키지는 니가 설치해줘\n- ocr 패키지는 EasyOCR을 이용해\n- 원본도 16:9 크기고, 만들려고 하는 pptx도 16:9 크기야\n- 우선 PDF파일을 읽어오는 메뉴만들고, 저장 파일명 및 경로를 지정하는 메뉴도 만들어줘\n- pptx 파일명은 업로드한 pdf파일명과 동일하게 자동 설정해.\n- 글꼴은 맑은 고딕과 나눔고딕이 있던데, 나눔스퀘어 Bold체도 추가해.\n- 변환을 누르면 슬라이드를 하나씩 읽어서 슬라이드에 있는 텍스트를 OCR로 읽어줘, 텍스트는 한글, 영어 등으로 되어 있어\n- 기존 텍스트가 있던 위치의 이미지 글자를 배경과 동일하게 만들어줘(텍스트를 삭제)\n- 그 다음 그위치에 추출한 텍스트를 원래 크기 그대로 삽입해줘\n- 이미지 등 다른 레이아웃은 절대로 변경하지마,\n- 좌표 정밀도: 이미지의 해상도(px)와 PPT의 물리적 크기(inch)는 다르기 때문에 비율 계산(Ratio)이 중요해:\n. PPT_Width = 10 inches, PPT_Height = 5.625 inches (16:9 기준)\n. 기본 폰트로 나눔고딕, 맑은 고딕, 나눔스퀘어 Bold를 선택하게 해줘"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어.\n구글 노트북 LM으로 작성한 이미지 슬라이드를 편집가능한 PPTX로 변환하는 앱을 만들어줘\n1. 개발환경\n  - 파이썬 PyQt5 패키지를 이용\n  - 나에게 없는 패키지는 설치\n  - OCR 패키지: EasyOCR\n  - 원본 16:9, 출력 PPTX도 16:9\n  - PPT_Width = 10 inches, PPT_Height = 5.625 inches (16:9 기준)\n  - 좌표 정밀도: 이미지 해상도(px)와 PPT 물리적 크기(inch) 비율 계산(Ratio) 적용\n\n2. 노드설명\n  - PDF 파일 읽기\n  - 저장 파일명 및 경로 지정\n  - PPTX 파일명은 업로드한 PDF 파일명과 동일하게 자동 설정\n  - 변환 실행 시 슬라이드를 하나씩 읽어서 OCR로 텍스트 추출 (한글, 영어 등)\n  - 기존 텍스트가 있던 위치의 이미지 글자를 배경과 동일하게 처리 (텍스트 삭제)\n  - 추출한 텍스트를 원래 위치 및 크기 그대로 삽입\n  - 이미지 등 다른 레이아웃은 변경하지 않음\n\n3. UI설명\n  - PDF 파일 불러오기 메뉴\n  - 저장 경로 및 파일명 지정 메뉴\n  - 기본 폰트 선택: 나눔고딕, 맑은 고딕, 나눔스퀘어 Bold\n  - 변환 실행 버튼"}]},{"title":"4. 유튜브 영상 다운로드","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\n유튜브 영상 링크를 붙여넣기 하면 해당 영상을 다운로드 하는 앱을 만들거야\n\n - Python으로 YouTube 링크를 입력하면 영상 또는 음원을 다운로드할 수 있는 GUI 앱을 만들어줘\n - GUI 프레임워크는 PyQt5 사용\n - 영상/음원 정보 분석 및 다운로드는 yt-dlp 패키지 사용\n - 사용자가 유튜브 링크 입력, 다운로드 폴더 선택 \n - “분석” 버튼 클릭 → yt-dlp로 해당 링크 분석 후 가능한 다운로드 포맷 리스트 출력\n - 사용자가 포맷 선택\n - “다운로드” 버튼 클릭 → 선택한 포맷으로 영상 또는 음원 다운로드\n - UI는 심플하게 구성"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어.\n유튜브 영상 링크를 붙여넣기 하면 해당 영상을 다운로드 하는 앱을 만들거야\n1. 개발환경\n  - Python 사용\n  - GUI 프레임워크: PyQt5\n  - 영상/음원 분석 및 다운로드: yt-dlp 패키지\n\n2. 노드설명\n  - 유튜브 링크 입력\n  - 다운로드 폴더 선택\n  - \"분석\" 버튼 클릭 시 yt-dlp로 링크 분석 후 가능한 다운로드 포맷 리스트 출력\n  - 사용자가 포맷 선택\n  - \"다운로드\" 버튼 클릭 시 선택한 포맷으로 영상 또는 음원 다운로드\n\n3. UI설명\n  - 심플한 UI 구성\n  - 유튜브 링크 입력창\n  - 다운로드 폴더 선택 메뉴\n  - 분석 버튼\n  - 포맷 리스트 출력 영역\n  - 다운로드 버튼"}]}]},{"name":"5. 바이브코딩 기반 웹 개발","items":[{"title":"1. flask 실행","contents":[{"text":"from flask import Flask\n\napp = Flask(__name__)    # 내 프로그램을 Flask 앱으로 등록\n\n@app.route('/')    # 사용자가 홈페이지 주소로 들어오면\ndef hello():\n    return \"안녕하세요! 여러분의 첫 번째 웹 서버입니다.\" \n\nif __name__ == '__main__':\n    app.run()    # 서버 실행!"}]},{"title":"2. 포트 변경","contents":[{"text":"from flask import Flask\n\napp = Flask(__name__)\n\n@app.route('/')\ndef hello():\n    return \"80번 포트로 접속하셨습니다!\"\n\nif __name__ == '__main__':\n    # port 설정을 추가하여 80번 문을 엽니다.\n    app.run(host='0.0.0.0', port=80)"}]},{"title":"3. PDF 번역","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\nPDF파일을 업로드하면 번역해주는 웹을 만들거야\n\n - flask패키지와 pypdf(또는 pypdf2)를 이용해서 단순하게 만들고 싶어\n - 번역은 open api key를 사용할거야\n - open api key는 나의 시스템 환경 변수에 저장되어 있어\n - 영어를 한국어로, 한국어를 영어로 선택할 수 있게 해\n - 번역후에 저장 할 수 있게 만들어\n - 번역 진도율을 볼 수 있게 해\n - pdf에서 텍스트만 추출해서 번역하고 번역된 내용을 텍스트 파일에 저장해\n - 저장하는 파일명은 업로드한 pdf파일명이랑 동일하게 설정해\n - pdf에서 추출한 텍스트와 번역한 내용을 미리보기로 볼 수 있도록 해"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어\nPDF파일을 업로드하면 번역해주는 앱을 만들고 싶어\n1. 개발환경\n  - Flask 패키지 사용\n  - pypdf (또는 pypdf2) 사용\n  - 번역: OpenAI API 사용\n  - OpenAI API key는 시스템 환경 변수에 저장\n\n2. 노드설명\n  - PDF 파일 업로드 시 텍스트 추출\n  - 영어→한국어, 한국어→영어 번역 방향 선택에 따라 OpenAI API 호출\n  - 번역 진도율 실시간 전달\n  - 번역 완료 후 업로드한 PDF 파일명과 동일한 이름으로 텍스트 파일 저장\n  - 추출한 텍스트와 번역 결과 미리보기 반환\n\n3. UI설명\n  - PDF 업로드 메뉴\n  - 번역 방향 선택 (영어→한국어 / 한국어→영어)\n  - 번역 진도율 표시 UI\n  - 원문 텍스트 미리보기 영역\n  - 번역 결과 미리보기 영역\n  - 저장 버튼"}]},{"title":"4. 물품 공유","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\n아나바다처럼 물품 공유 웹을 만들고 싶어\n - flask패키지를 이용해.\n - 사용자가 물품 사진을 등록, 수정, 삭제할 수 있어야 돼\n - 물품에 대한 설명을 넣을 수 있어야돼\n - 가격을 넣을 수도 있어야 하고, 무료도 있어야 돼\n - 데이터베이스: Database(등록자, 등록일, 수정일, 제품정보?등)가 있어야 돼, \n - 이 외에도 추가 기능이 필요하면 추가해줘"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어.\n아나바다처럼 물품 공유 웹을 만들고 싶어\n1. 개발환경\n  - Flask 패키지 사용\n  - 데이터베이스 구성: 등록자, 등록일, 수정일, 제품정보\n  - 물품 사진 파일 업로드 저장소 구성\n  - 사용자 인증 세션 관리\n\n2. 노드설명\n  - 물품 사진 등록, 수정, 삭제\n  - 물품 설명 입력\n  - 가격 입력 (무료 옵션 포함)\n  - 물품 목록 조회 및 검색\n  - 사용자 회원가입 및 로그인/로그아웃\n  - 관심 물품 찜하기 기능\n  - 등록자 간 댓글 또는 문의 기능\n  - 거래 완료 상태 표시\n\n3. UI설명\n  - 메인 페이지: 물품 목록 카드형 표시\n  - 물품 등록 폼 (사진 업로드, 설명, 가격/무료 선택)\n  - 물품 수정/삭제 버튼\n  - 검색창\n  - 회원가입 / 로그인 메뉴\n  - 찜하기 버튼\n  - 댓글/문의 입력 영역\n  - 거래 완료 배지 표시"}]},{"title":"5. 발전기 복합출력 예측","contents":[{"text":"아래 내용을 참고해서 개발환경, 노드(기능), UI로 구분해줘\n=====\n파일을 업로드하면 변수 변화에 따라 예측하는 시스템을 만들고 싶어\n\n 2. 개요\n  - 파이썬을 flask를 활용해서 예측 시스템 코드를 생성해줘\n  - 그래프 그릴때 한글이 안깨지도록 설정해줘\n  - 파일 업로드 부터 시뮬레이션 단계까지 순차적으로 진행되는데\n    전단계의 결과가 다음 단계에서 사용되는거야, 세션이 유지될 수 있도록\n    전 단계 결과를 sqlite3에 저장해서 사용해줘\n\n 3. 화면구성\n  - user inteface의 컬러는 연한 녹색, 연한 파란색, 회색으로 만들어줘\n  - 화면을 2분할하는데 좌측을 20%, 우측을 80% 비율로 만들어줘, 우측 화면을 상단 10%, 하단 90%로 분할해줘\n  - 좌측 화면 메뉴 구성은 \"1. 파일 업로드\", \"2. 변수 선택\",  \"3. 결측치 제거\", \"4. 이상치 탐색\", \"5. 탐색적 분석\", \"6. 회귀분석\", \"7. 모델 검증\", \"8. 시뮬레이션\" 으로 해줘\n  - 좌측 화면 메뉴는 순서대로 진행되어야 하기 때문에 처음에는 \"1. 파일 업로드\"를 진하게 표시하고 나머지 메뉴는 연하게 표시해줘,\n    하나의 메뉴가 실행된 후 다음 메뉴를 진하게 표시해줘\n  - 우측 화면 상단은, 좌측 메뉴를 눌렸을때 단계(예시 : 2. 변수선택)등이 표시되고 우측 하단 화면은 서브메뉴와 실행 결과가 나와야해\n\n4. 메뉴별 구성\n  - \"1. 파일 업로드\" 메뉴를 클릭하면 폴더에서 csv, excel 파일을 업로드 할 수 있게 해줘,\n    파일을 업로드 하면 우측화면 하단에 pandas 패키지를 이용해서 10개의 행만 출력\n    해줘, 그리고 각 변수의 기초 통계량을 출력해줘\n\n  - \"2. 변수 선택\" 메뉴를 클릭하면 우측 화면 상단에 종속변수와 독립변수를 선택하는 \n    메뉴 만들어줘, 사용자가 변수를 선택하면 그것을 기준으로 차후 분석을 진행해야해\n\n  - \"3. 결측치\" 제거 메뉴를 클릭하면 결측치가 있는 행을 찾고 제거해줘,\n    결과 값으로 총 몇개의 행이 있었고, 결측치 행을 몇개 제거했는지, 현재 몇개행이\n    남아 있는지 표시해줘\n\n  - \"4. 이상치 탐색\" 메뉴를 클릭하면 각 변수별  +,- 3 표준편차 범위 밖에 존재하는\n    데이터가 몇개나 있는지 표시해줘, 그리고 변수별 이상치 행을 제거해야 하는지 우측\n    화면 상단에서 선택할 수 있도록 표시해줘, 사용자가 이상치 제거를 선택하면\n    이상치 행을 제거해줘\n\n  - \"5. 탐색적 분석\" 메뉴를 클릭하면 우측화면 상단에 \"히스토그램\" , \"산점도\",\n    \"상관관계(히트맵)\" 분석 메뉴를 표시해줘, \"히스토그램\"을 선택하면 사용자가 변수를 \n    선택할 수 있도록 하고, 변수 선택 후 히스토그램과 밀도 곡선을 겹쳐서 그려줘,\n    \"산점도\"를 선택하면 여러개의 변수를 선택하게 하고, 변수 선택 후 산점도를 그려줘,\n    \"상관관계(히트맵)\"을 선택하면 전체 변수의 상과계수가 표시된 히트맵을 그려줘\n\n  - \"6. 회귀분석\" 메뉴를 클릭하면 우측 상단 화면에 \"전진선택법\", \"후진제거법\", \"릿지\", \n    \"라쏘\" 메뉴가 보이게 해줘,\n    사용자가 선택한 메뉴로 회귀분석을 실시하고, 회귀모형과, 예측 정확도를 출력해줘,\n    사용자가 모델의 결과값을 보고 최종 모델을 선택할 수 있도록 해줘\n \n  - \"7. 모델검증\"을 클릭하면 잔차분석과 적합도검정을 진행하고 결과를 보여줘\n\n  - \"8. 시뮬레이션\"을 클릭하면 만들어진 회귀모형을 시뮬레이션 할 수 있도록 해줘\n    우측화면의 상단에는 사용자가 선택한 회귀식을 출력해줘\n    인터랙티브한 그래프 출력을 위해 Plotly, Dash 패키지를 사용해줘\n    우측화면의 화단에는 회귀모형의 독립변수를 슬라이더바로 입력할 수 있게 하고\n    아래쪽에는 종속변수의 값과 막대그래프로 크기 변화를 출력해줘\n    가독성있게 한 화면에서 슬라이더바 입력, 종속변수 값이 출력되어야 해\n  \n 5. 기타\n  - 추가로 필요한 기능이 있다면 나한테 물어보고 추가해줘\n  - 웹 시스템은 한글로 구현해줘"},{"text":"커서로 예측 시스템을 만들건데, 아래 내용을 커서에 넣을 프롬프트로 작성해줘\n파이썬 Flask를 활용한 예측 시스템을 개발하고 싶어\n1. 개발환경\n  - Flask 패키지 사용\n  - 데이터 처리: pandas 패키지\n  - 그래프: matplotlib (한글 깨짐 방지 설정), Plotly, Dash\n  - 세션 관리: SQLite3 (단계별 결과 저장, 전 단계 결과를 다음 단계에서 사용)\n  - 파일 업로드: csv, excel 지원\n  - 전체 시스템 한글로 구현\n\n2. 노드설명\n  - 파일 업로드부터 시뮬레이션까지 순차적으로 진행\n  - 각 단계의 결과는 SQLite3에 저장되며, 다음 단계에서 이전 결과를 불러와 사용\n  - 파일 업로드: csv, excel 업로드 후 pandas로 10개 행 출력 및 기초 통계량 출력\n  - 변수 선택: 종속변수 및 독립변수 선택, 이후 분석에 적용\n  - 결측치 제거: 결측치 행 탐색 및 제거, 총 행 수 / 제거 행 수 / 잔여 행 수 출력\n  - 이상치 탐색:\n    · 변수별 ±3 표준편차 범위 밖 데이터 탐색\n    · 변수별 이상치 제거 여부 선택 및 제거\n  - 탐색적 분석:\n    · 히스토그램: 변수 선택 후 히스토그램 + 밀도 곡선 출력\n    · 산점도: 다중 변수 선택 후 산점도 출력\n    · 상관관계(히트맵): 전체 변수 상관계수 히트맵 출력\n    - 회귀분석:\n    · 전진선택법 / 후진제거법 / 릿지 / 라쏘 선택\n    ·  회귀모형 및 예측 정확도 출력, 최종 모델 선택\n  - 모델 검증: 잔차분석 및 적합도 검정 결과 출력\n  - 시뮬레이션: 선택된 회귀모형으로 시뮬레이션, 독립변수 슬라이더바 입력, 종속변수 값 및 막대그래프 출력\n  - 단계별 순차 진행 (전 단계 완료 후 다음 단계 활성화)\n  - 추가 기능 필요 시 사용자에게 확인 후 추가\n\n3. UI설명\n  - 컬러: 연한 녹색, 연한 파란색, 회색- 화면 2분할: 좌측 20% / 우측 80%\n  - 우측 화면: 상단 10% (현재 단계 표시) / 하단 90% (서브메뉴 및 실행 결과)\n  - 좌측 메뉴 구성: 1.파일업로드 / 2.변수선택 / 3.결측치제거 / 4.이상치탐색 / 5.탐색적분석 / 6.회귀분석 / 7.모델검증 / 8.시뮬레이션\n  - 좌측 메뉴: 현재 단계 진하게, 나머지 연하게 표시, 단계 완료 시 다음 메뉴 활성화\n  - 우측 상단: 현재 메뉴 단계명 표시\n  - 우측 하단: 서브메뉴 및 실행 결과 표시\n  - 탐색적 분석 서브메뉴: 히스토그램 / 산점도 / 상관관계(히트맵) 탭\n  - 회귀분석 서브메뉴: 전진선택법 / 후진제거법 / 릿지 / 라쏘 탭\n  - 시뮬레이션: 회귀식 출력, 슬라이더바 입력, 종속변수 값 및 막대그래프 한 화면 구성 (Plotly/Dash)"}]},{"title":"6. 영상 이미지 분석","contents":[{"text":"YOLOv11 Nano 기반의 가장 단순한 사물 인식 웹페이지를 만들거야\n\n - flask로 최대한 단순하게 만들거야\n - 필요한 패키지, 기능과 UI에 대해서 설명해줘"},{"text":"아래 내용을 참고해서 Cursor에 넣을 프롬프트 만들어\nYOLOv11 Nano 기반의 가장 단순한 사물 인식 웹페이지를 만들거야\n1. 개발 환경\n  - Flask, ultralytics(yolo11n.pt), opencv-python\n\n2. 노드설명\n  - 이미지 업로드: 이미지를 올리면 YOLO 바운딩 박스가 그려진 결과 이미지 표시\n  - 웹캠 스트리밍: Flask 비디오 스트리밍을 활용해 실시간으로 YOLO 인식 화면 출력\n  - 복잡한 기능 없이 가장 단순하고 직관적인 코드로 한 번에 만들어줘\n\n3. UI\n  - HTML 단일 페이지 (Tailwind CSS로 깔끔하고 미니멀하게 디자인)\n  - 이미지 업로드 구역과 실시간 웹캠 화면 구역을 직관적으로 배치"}]}]},{"name":"6. 바이브코딩 스킬 활용","items":[{"title":"1. md파일 작성 요청","contents":[{"text":"나는 \"오늘의 할일\" 앱을 만들 거야.\n기능: 할일 추가, 완료 체크, 삭제, 카테고리(업무/개인/공부) 분류, 마감일 설정\n - Backend: Python Flask\n  - Frontend: 순수 HTML + CSS + JavaScript\n  - Database: SQLite3\n\n아래 3개 MD 파일 초안을 각각 작성해줘.\n파일에 바로 붙여넣을 수 있게 마크다운 형식으로, 구체적으로 작성해줘.\n\n1. ui.md          : 페이지 목록, 컴포넌트 구조, 색상·폰트 규칙\n2. architecture.md: 기술 스택, 폴더 구조, API 엔드포인트, DB 스키마\n3. prompts.md     : AI 코딩 규칙, 자주 쓸 프롬프트 템플릿"}]},{"title":"2. Skill 활용 방법","contents":[{"text":"https://www.skills.sh"},{"text":"https://ko-skills.pages.dev"}]},{"title":"3. grill-me 스킬","contents":[{"text":"https://www.skills.sh/mattpocock/skills/grill-me"}]},{"title":"4. to-spec 스킬","contents":[{"text":"https://skills.sh/mattpocock/skills/to-spec"},{"text":"지금까지 내용을 SPEC.md파일에 작성해줘"}]},{"title":"5. 실습 예제","contents":[{"text":"냉장고에 남은 재료를 입력하면 만들 수 있는 요리를 추천해주는 앱을 만들고 싶어"}]}]},{"name":"7. LangChain 이해","items":[{"title":"1. 기본 호출","contents":[{"text":"curl https://api.openai.com/v1/chat/completions ^\n  -H \"Content-Type: application/json\" ^\n  -H \"Authorization: Bearer %OPENAI_API_KEY%\" ^\n  -d \"{\\\"model\\\": \\\"gpt-4o-mini\\\", \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"내 이름은 민준이야. 반가워! \\\"}]}\""},{"text":"curl https://api.openai.com/v1/chat/completions ^\n  -H \"Content-Type: application/json\" ^\n  -H \"Authorization: Bearer %OPENAI_API_KEY%\" ^\n  -d \"{\\\"model\\\": \\\"gpt-4o-mini\\\", \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"내 이름이 뭐게?\\\"}]}\""}]},{"title":"2. 메모리 주입","contents":[{"text":"curl https://api.openai.com/v1/chat/completions ^\n  -H \"Content-Type: application/json\" ^\n  -H \"Authorization: Bearer %OPENAI_API_KEY%\" ^\n  -d \"{\\\"model\\\": \\\"gpt-4o-mini\\\", \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"안녕, 내 이름은 민준이야.\\\"}, {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": \\\"안녕하세요 민준님!\\\"}, {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"내 이름이 뭐게?\\\"}]}\""}]}]},{"name":"8. RAG 코드리뷰","items":[{"title":"1. RAG 원리","contents":[{"text":"너는 오직 제공된 [컨텍스트]의 정보만을 근거로 답변하는 챗봇이야.\n[컨텍스트]에 포함되지 않은 정보(날씨, 일반 상식 등)에 대해서는 절대 네 배경지식을 사용하지 마.\n만약 답변을 위한 정보가 [컨텍스트]에 없다면, 다른 부연 설명 없이 \"\"죄송합니다. 답변을 드릴 수 없습니다.\"\"라고만 답변해.\n\n[컨텍스트]\n1. 수습 기간은 채용일로부터 3개월로 하며, 수습 기간 중 업무 수행 능력이 현저히 낮다고 판단될 경우 계약을 해지할 수 있다.\n2. 시차출퇴근제 운영 시 08:00~10:00 사이 자율 출근하며, 하루 8시간 근무를 기본으로 한다.\n3. 평가는 연 2회(상/하반기) 실시하며, 평가 결과는 5등급(S, A, B, C, D)으로 분류하여 연봉 조정에 반영한다.\n4. 임금은 매월 25일에 지급하며, 지급일이 휴일인 경우 전일에 지급한다.\n5. 1년간 80% 이상 출근한 직원에게 15일의 유급휴가를 부여하며, 미사용 연차는 연차수당으로 보상한다.\n6. 인사위원회 심의를 거쳐 징계 사유가 타당하다고 인정될 경우 해고할 수 있다.\n\n#위 사항을 반드시 준수하면서 답변을 해 주길 바래\n---------------\n임금 지급일은?\n연차를 사용하지 않으면 연차 수당이 지급되나?\n미국과 이라크 전쟁 상황은?"}]}]},{"name":"9. RAG 구현","items":[{"title":"1 : General Rag 구현","contents":[{"text":"파이썬 langchain 패키지를 이용해서 rag를 만들어줘\n- 로컬 PC에 설치된 파이썬 패키지와 패키지 버전은 현재 폴더의 requirements.txt를 참고해 줘.\n- flask 패키지를 이용해 웹페이지를 만들어줘\n- user interface는 chatgpt와 유사하게 만들어줘\n- 버튼, 창 스타일은 연한 청색, 회색 컬러로 산뜻하게 만들어줘 \n- 왼쪽 메뉴창 상단에 파일 업로드 버튼표시 (여러개 파일 업로드) \n- pdf 파일만 업로드 할꺼야\n- llm은 gpt-4o-mini 모델을 사용해야해. api-key는 나의 시스템 환경에 있으니 설정 안해도 돼\n- 이파일을 PyPDFLoader 로 로딩해줘\n- RecursiveCharacterTextSplitter로  500글자 분할, 100글자 오버랩\n- text-embedding-3-small로 임베딩하고 chromadb에 저장\n- 사용자가 질문을 할때 유사한 chunk를 4개까지 검색해줘\n- 답변 출력 후, 참고한 chunk 내용 및 페이지번호를 요약하여 출력해줘\n- chunk가 검색되지 않으면 \"정보가 없어서 답변할 수 없습니다“  라고 대답해야해\n- 대화 메모리 기능을 사용해줘"},{"text":"# RAG 기반 Flask 웹앱 개발 프롬프트\n\n## 1. 목표\n- 이 프로젝트는 PDF 문서를 업로드하고, 문서 내용을 기반으로 질의응답이 가능한 **RAG 기반 웹 챗봇**을 만드는 것이다.\n- 사용자 시나리오: ① 왼쪽 메뉴창에서 PDF 파일 업로드(다중 업로드 가능) → ② 채팅창에서 질문 입력 → ③ 답변 + 참고한 chunk 내용과 페이지 번호 확인\n- UI/UX는 ChatGPT와 유사한 형태(왼쪽 사이드바 + 오른쪽 채팅 영역)로 구성한다.\n\n## 2. 기술 스펙\n\n### 환경 및 프레임워크\n- Python 패키지: LangChain 사용\n- 로컬 환경에 설치된 패키지 및 버전은 현재 폴더의 `requirements.txt`파일에 있으며, 반드시 여기에 있는 패키지 및 버전만 사용할 것.\n- 웹 프레임워크: Flask\n- LLM: `gpt-4o-mini` (API Key는 시스템 환경변수에 설정되어 있으므로 코드 내 별도 설정 불필요)\n\n### RAG 파이프라인\n- 문서 로딩: `PyPDFLoader`\n- 청킹: `RecursiveCharacterTextSplitter` (chunk size 500자, overlap 100자)\n    - 분할 기준(separators)은 \"문단 → 문장\" 순으로 우선 적용\n    - 예: `separators=[\"\\n\\n\", \"\\n\", \". \", \"? \", \"! \", \" \", \"\"]`\n    - 문단 구분(빈 줄, 줄바꿈)을 최우선으로 분할하고, 문단 내에서는 문장 단위(마침표, 물음표, 느낌표 뒤)로 분할되도록 구성\n- 임베딩: `text-embedding-3-small`\n- 벡터 DB: ChromaDB\n- 검색: 질문 시 유사도 기준 상위 4개 chunk 검색\n- 대화 메모리 기능 포함 (이전 대화 맥락 유지)\n\n### UI 상세\n- 왼쪽 메뉴창: 상단에 파일 업로드 버튼 배치 (PDF 다중 업로드 지원)\n- 색상 톤: 연한 청색 + 회색 계열, 산뜻하고 깔끔한 느낌\n- 채팅창: ChatGPT 스타일의 대화형 인터페이스\n\n### 응답 형식\n- 답변 출력 후, 답변 하단에 참고한 chunk 내용 요약 및 페이지 번호를 함께 표시\n\n## 3. 제약조건 & 완료 기준\n\n### 제약조건\n- 업로드 가능한 파일 형식은 PDF만 허용 (다른 형식은 업로드 제한 또는 오류 처리)\n- 검색된 관련 chunk가 없을 경우, 반드시 \"정보가 없어서 답변할 수 없습니다\"라고만 응답 (임의로 답변 생성 금지)\n\n### 완료 기준 (Definition of Done)\n1. PDF 여러 개를 업로드하면 정상적으로 벡터 DB에 저장된다.\n2. 질문 시 관련 chunk 4개를 검색하여 답변에 반영한다.\n3. 답변과 함께 참고 chunk 요약 + 페이지 번호가 함께 출력된다.\n4. 관련 정보가 없을 경우 지정된 문구로만 응답한다.\n5. 이전 대화 맥락을 반영한 대화가 가능하다."}]},{"title":"2 : Local LLM, 임베딩 모델 활용 Rag 구현하기","contents":[{"text":"파이썬 langchain 패키지를 이용해서 rag를 만들어줘\n - flask 패키지를 이용해 웹페이지를 만들어줘\n - user interface는 chatgpt와 유사하게 만들어줘\n - 버튼, 창 스타일은 연한 청색, 회색 컬러로 산뜻하게 만들어줘 \n - 왼쪽 메뉴창 상단에 파일 업로드 버튼표시 (여러개 파일 업로드) \n - pdf 파일만 업로드 할꺼야\n - llama-cpp-python 사용해줘 \u000b  (llm 과 임베딩 모델 모두 local 에 저장되어 있음)\n - llm은 \"./models/exaone_2.4b/EXAONE-3.5-2.4B-Instruct-\u000b    Q5_K_M.gguf\" 이용해\n - 임베딩 모델은 “./models/bge-m3\" 을 이용해서 500글자 분할, \u000b   100글자 오버랩, chromadb에 저장\n - 사용자가 질문을 할 때 유사한 chunk를 4개까지 검색해줘\n - chunk가 검색되지 않으면 \"정보가 없어서 답변할 수 없습니다\"\u000b   라고 대답해야 해\n - 대화 메모리 기능을 사용해줘\n - 답변을 출력한 후, 참고한 chunk 정보도 같이 출력해줘"},{"text":"# RAG 기반 Flask 웹앱 개발 프롬프트\n\n## 1. 목표 & 컨텍스트\n\n- 이 프로젝트는 PDF 문서를 업로드하고, 문서 내용을 기반으로 질의응답이 가능한 **RAG 기반 웹 챗봇**을 만드는 것이다.\n- 사용자 시나리오: ① 왼쪽 메뉴창에서 PDF 파일 업로드(다중 업로드 가능) → ② 채팅창에서 질문 입력 → ③ 답변 + 참고한 chunk 내용과 페이지 번호 확인\n- UI/UX는 ChatGPT와 유사한 형태(왼쪽 사이드바 + 오른쪽 채팅 영역)로 구성한다.\n\n## 2. 기술 스펙\n\n### 환경 및 프레임워크\n- Python 패키지: LangChain 사용\n- 로컬 환경에 설치된 패키지 및 버전은 현재 폴더의 `requirements.txt`파일에 있으며, 반드시 여기에 있는 패키지 및 버전만 사용할 것.\n- 웹 프레임워크: Flask\n- LLM 및 임베딩 실행 방식: `llama-cpp-python` 사용 (LLM, 임베딩 모델 모두 로컬 파일로 보유)\n- LLM: 로컬 GGUF 모델 사용 ? 경로: `./models/exaone_2.4b/EXAONE-3.5-2.4B-Instruct-Q5_K_M.gguf`\n\n### RAG 파이프라인\n- 문서 로딩: `PyPDFLoader`\n- 청킹: `RecursiveCharacterTextSplitter` (chunk size 500자, overlap 100자)\n  - 분할 기준(separators)은 \"문단 → 문장\" 순으로 우선 적용\n  - 예: `separators=[\"\\n\\n\", \"\\n\", \". \", \"? \", \"! \", \" \", \"\"]`\n  - 문단 구분(빈 줄, 줄바꿈)을 최우선으로 분할하고, 문단 내에서는 문장 단위(마침표, 물음표, 느낌표 뒤)로 분할되도록 구성\n- 임베딩: 로컬 임베딩 모델 사용 ? 경로: `./models/bge-m3` (`llama-cpp-python`으로 로딩)\n- 벡터 DB: ChromaDB\n- 검색: 질문 시 유사도 기준 상위 4개 chunk 검색\n- 대화 메모리 기능 포함 (이전 대화 맥락 유지)\n### UI 상세\n- 왼쪽 메뉴창: 상단에 파일 업로드 버튼 배치 (PDF 다중 업로드 지원)\n- 색상 톤: 연한 청색 + 회색 계열, 산뜻하고 깔끔한 느낌\n- 채팅창: ChatGPT 스타일의 대화형 인터페이스\n\n### 응답 형식\n- 답변 출력 후, 답변 하단에 참고한 chunk 내용 요약 및 페이지 번호를 함께 표시\n\n## 3. 제약조건 & 완료 기준\n\n### 제약조건\n- 업로드 가능한 파일 형식은 PDF만 허용 (다른 형식은 업로드 제한 또는 오류 처리)\n- 검색된 관련 chunk가 없을 경우, 반드시 \"정보가 없어서 답변할 수 없습니다\"라고만 응답 (임의로 답변 생성 금지)\n\n### 완료 기준\n1. PDF 여러 개를 업로드하면 정상적으로 벡터 DB에 저장된다.\n2. 질문 시 관련 chunk 4개를 검색하여 답변에 반영한다.\n3. 답변과 함께 참고 chunk 요약 + 페이지 번호가 함께 출력된다.\n4. 관련 정보가 없을 경우 지정된 문구로만 응답한다.\n5. 이전 대화 맥락을 반영한 대화가 가능하다. "}]},{"title":"3 : 계약서 검토 Rag 구현","contents":[{"text":"내가 만들려고 하는 웹 시스템은 아래와 같아\n\n0. 제목 : LLM 기반 계약서 검토 웹\n\n1. 개요\n- 로컬 PC에 설치된 파이썬 패키지와 패키지 버전은 현재 폴더의 requirements.txt를 참고해 줘.\n- 파이썬 langchain 0.3X 버전 패키지를 이용해서 LLM 기반 계약서 검토 웹 코드를 생성해줘\n- 계약서 가이드라인이나, 약관을 업로드해서 rag를 구현하고, 사용자가 계약서를 업로드하면\n  한 문장씩 읽고, rag에서 유사 문서를 검색후, 가이드라인이나 약관에 위배사항이 있는지 검토하고 계약서를 수정해서 출력하는 웹서비스를 구현하는 거야\n\n2. 패키지 버전 및 환경\n- flask 패키지를 이용해, llm은 gpt-4o-mini 모델을 사용해\n- langchain 등 패키지 버전은 내 시스템에 설치된 ‘requirements.txt' 파일을 참조해줘\n- api-key는 나의 시스템 환경에 있으니 설정 안해도 되\n- 시스템 구현을 위해 추가적으로 필요한 패키지 버전은 알려줘\n- 코드들은 이해하기 쉽게 주석을 추가해줘\n\n3. 메뉴 구성\n- user interface는 chatgpt와 유사하게 만들어줘 (왼쪽 : 메뉴, 오른쪽 : 채팅 및 결과 )\n- 화면 구성은 연한 파랑색과, 연한 회색을 이용해 줘\n- 왼쪽 메뉴는 'rag 파일 업로드' 버튼 과  '계약서 업로드' 버튼이 있어야 해\n- '계약서 업로드가 완료되면 '계약서 검토' 버튼이 보여야 해\n- 오른쪽 화면은 답변을 보여주고, 하단에는 일반적인 질문을 할 수 있는 질문창을 보이게 해줘\n- rag 파일 업로드, 계약서 업로드시 답변 창에 진행율을 보여주고 완료 결과를 출력해줘 (tqdm 패키지 활용, 바 출력)\n\n4. rag 구현\n- 'rag 파일 업로드' 버튼을 누르면 pdf 파일을 업로드 할 수 있도록 구성해줘\n- PyPDFLoader로 여러개의 파일을 업로드 할 수 있어야 해\n- 업로드한 문서를 RecursiveCharacterTextSplitter로  30글자로 분할, 5글자로 오버랩해줘, separators는 [\"\\n\\n\",\"\\n\"]\n- text-embedding-3-small 로 임베딩하고 chromadb에 저장해\n\n5 계약서 검토 구현\n- '계약서 업로드' 버튼을 누르면 PyPDFLoader로 pdf 파일을 업로드 할 수 있게 해줘\n- 계약서를 RecursiveCharacterTextSplitter로  30글자로 분할, 오버랩 하지마, separators는  [\"\\n\\n\",\"\\n\"]\n- 계약서 문장과 rag 문서를 비교하여 계약서 문장에 오류 또는 보완이 필요한 부분을 찾은 후 수정해줘\n- 계약서 문장을 '[원문]' 이라고 표시후 출력하고 오류를 수정한 문장을 '[수정 문구]' 라고 표시한 후  진한 파란 글씨체로 원문의 바로 밑에 출력해줘 (7. 출력 예시 참조)\n- 계약서 문장에 이상이 없다면 원문만 출력하면 됨\n- 화면에 문장 하나씩 하나씩 출력해줘, 한꺼번에 출력되면 검토하는 동안 진행 여부를 확인할 수 없어\n\n6. 기타\n- 사용자가 일반적인 질문을 하게 되면 rag를 이용하지 말고 llm에 직접 요청해서 답변을 생성하면 되\n- 만약 성능 향상을 위해 에이전트가 필요하다면 langgraph 패키지를 이용해서 에이전트를 구현해줘\n\n7. 출력 예시\n[원문] 3. 계약체결 및 작업완료 후라도 본 계약금액의 산출내역중 적용물량, 적용단가, 제비용 등의 적용이 과다 또는  과소하게 책정된 것이 발견된 때에는 도급인과 수급인은 협의하여 이를 감액 또는 증액 조정할 수 없다.\n[수정문구] 3. 계약체결 및 작업완료 후라도 본 계약금액의 산출내역중 적용물량, 적용단가, 제비용 등의 적용이 과다 또는  과소하게 책정된 것이 발견된 때에는 도급인과 수급인은 협의하여 이를 감액 또는 증액 조정할 수 있다."}]}]}];
const nav = document.getElementById('nav');
const content = document.getElementById('content');
let activeEl = null;

function buildNav(filter){
  nav.innerHTML='';
  const f = (filter||'').trim().toLowerCase();
  DATA.forEach((mod)=>{
    const matched = mod.items.filter(it=> !f || it.title.toLowerCase().includes(f) || mod.name.toLowerCase().includes(f) || it.contents.some(c=>c.text.toLowerCase().includes(f)));
    if(matched.length===0) return;
    const mEl=document.createElement('div'); mEl.className='module';
    const nEl=document.createElement('div'); nEl.className='mod-head'; nEl.textContent=mod.name;
    mEl.appendChild(nEl);
    matched.forEach(it=>{
      const t=document.createElement('div'); t.className='title-item';
      t.textContent=it.title;
      t.onclick=()=>{ selectItem(t, mod, it); };
      mEl.appendChild(t);
    });
    nav.appendChild(mEl);
  });
}
function selectItem(el, mod, it){
  if(activeEl) activeEl.classList.remove('active');
  activeEl=el; el.classList.add('active');
  renderContent(mod, it);
}
function renderContent(mod, it){
  content.innerHTML='';
  const crumb=document.createElement('div'); crumb.className='crumb'; crumb.textContent=mod.name;
  const h=document.createElement('h2'); h.textContent=it.title;
  content.appendChild(crumb); content.appendChild(h);
  it.contents.forEach((c, i)=>{
    const block=document.createElement('div'); block.className='block';
    const head=document.createElement('div'); head.className='block-head';
    const label=document.createElement('span'); label.className='block-label'; label.textContent='콘텐츠 '+(i+1);
    const btn=document.createElement('button'); btn.className='copy-btn';
    btn.innerHTML=copyIcon()+'<span>복사</span>';
    btn.onclick=()=>doCopy(btn, c.text);
    head.appendChild(label); head.appendChild(btn);
    const pre=document.createElement('pre'); pre.className='code'; pre.textContent=c.text;
    block.appendChild(head); block.appendChild(pre);
    content.appendChild(block);
  });
}
function copyIcon(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';}
function checkIcon(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>';}
function sunIcon(){return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';}
function moonIcon(){return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';}

let toastTimer=null;
function showToast(text){
  const el=document.getElementById('toast');
  el.textContent=text; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1600);
}
function doCopy(btn, text){
  const done=()=>{ btn.classList.add('done'); btn.innerHTML=checkIcon()+'<span>복사됨!</span>';
    showToast('클립보드에 복사되었습니다');
    setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML=copyIcon()+'<span>복사</span>'; },1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}

// theme toggle
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerHTML = (t==='dark') ? sunIcon() : moonIcon();
  try{ localStorage.setItem('viewerTheme', t); }catch(e){}
}
themeBtn.addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  applyTheme(cur==='dark'?'light':'dark');
});
let savedTheme='dark';
try{ savedTheme=localStorage.getItem('viewerTheme')||'dark'; }catch(e){}
applyTheme(savedTheme);

document.getElementById('search').addEventListener('input', e=> buildNav(e.target.value));
const resizer=document.getElementById('resizer'); const sidebar=document.querySelector('.sidebar');
let dragging=false;
resizer.addEventListener('mousedown',()=>{dragging=true; document.body.style.userSelect='none'; document.body.style.cursor='col-resize';});
window.addEventListener('mousemove',e=>{ if(!dragging)return; const w=Math.max(210,Math.min(e.clientX, window.innerWidth*0.6)); sidebar.style.width=w+'px';});
window.addEventListener('mouseup',()=>{dragging=false; document.body.style.userSelect=''; document.body.style.cursor='';});
buildNav('');
</script>
</body>
